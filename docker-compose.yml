services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ourworld
      POSTGRES_USER: ourworld
      POSTGRES_PASSWORD: ourworld
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ourworld"]
      interval: 5s
      retries: 15
  web:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
